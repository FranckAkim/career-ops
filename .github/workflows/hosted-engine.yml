name: Hosted engine adapter

on:
  push:
    branches: [product/hosted-foundation]
    paths-ignore:
      - PROJECT_HANDOFF.md
      - docs/**
      - hosted/README.md
  pull_request:
    paths:
      - hosted/**
      - web/**
      - .github/workflows/hosted-engine.yml
      - openai-eval.mjs
      - openai-tailor.mjs
      - generate-pdf.mjs
      - verify-cv-facts.mjs
      - mark-pdf-ready.mjs
      - templates/**
      - modes/**
      - merge-tracker.mjs
      - tracker-parse.mjs
      - lib/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        # Linux is exercised in the actual worker container below. The native
        # Windows run additionally verifies the supported local development path.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix hosted test
      - run: npm ci --prefix hosted/control-plane --ignore-scripts --no-audit --no-fund
      - run: npm --prefix hosted/control-plane test
      - run: npm ci --prefix hosted/sandbox-worker --ignore-scripts --no-audit --no-fund
      - run: npm --prefix hosted/sandbox-worker test
      - run: npm --prefix hosted/sandbox-worker audit --omit=dev --audit-level=high
      - run: node validate-system-paths-coverage.mjs
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web run typecheck
      - run: node --test web/tests/hosted-mode.test.mjs web/tests/lib/origin-guard.test.mjs
      - run: npm ci --prefix hosted/web --ignore-scripts --no-audit --no-fund
      - run: npm --prefix hosted/web test
      - run: npm --prefix hosted/web run build

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker build -f hosted/Dockerfile --build-arg ENGINE_REVISION=${{ github.sha }} -t hosted-career-worker:local .
      - run: node hosted/prepare-seccomp.mjs "${RUNNER_TEMP}/hosted-seccomp.json"
      - name: Run the full Linux suite in the constrained worker image
        run: >-
          docker run --rm --init --network=none --read-only
          --cap-drop=ALL --security-opt=no-new-privileges
          --security-opt=seccomp=${RUNNER_TEMP}/hosted-seccomp.json
          --pids-limit=512 --memory=2g --cpus=2 --shm-size=256m
          --tmpfs=/tmp:rw,nosuid,noexec,size=256m
          --mount type=bind,source=${{ github.workspace }}/hosted/tests,target=/opt/career-ops/hosted/tests,readonly
          --workdir=/opt/career-ops/hosted --entrypoint=node
          hosted-career-worker:local --test 'tests/*.test.mjs'
      - run: npm --prefix hosted run test:container
        env:
          HOSTED_TEST_SECCOMP: ${{ runner.temp }}/hosted-seccomp.json
      - run: npm ci --prefix hosted/control-plane --ignore-scripts --no-audit --no-fund
      - run: npm --prefix hosted/control-plane test
      - run: npm ci --prefix hosted/web --ignore-scripts --no-audit --no-fund
      - run: npm --prefix hosted/web test
      - run: npm --prefix hosted/web run build
      - run: npx playwright install --with-deps chromium
      - name: Verify PostgreSQL recovery and supervised container publication
        run: |
          export HOSTED_TEST_IMAGE_ID="$(docker image inspect hosted-career-worker:local --format '{{.Id}}')"
          npm --prefix hosted/control-plane run test:postgres
        env:
          HOSTED_TEST_SECCOMP: ${{ runner.temp }}/hosted-seccomp.json
          HOSTED_TEST_WEB: '1'
          HOSTED_TEST_APP: deployment
